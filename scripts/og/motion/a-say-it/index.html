<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1200, height=628" />
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<style>
@font-face { font-family: "Clash Grotesk"; src: url("assets/fonts/ClashGrotesk-500.woff2") format("woff2"); font-weight: 500; }
@font-face { font-family: "Clash Grotesk"; src: url("assets/fonts/ClashGrotesk-600.woff2") format("woff2"); font-weight: 600; }
@font-face { font-family: "Clash Grotesk"; src: url("assets/fonts/ClashGrotesk-700.woff2") format("woff2"); font-weight: 700; }
:root { --blue: #103FEF; --navy: #050560; --soft: #E4EBFF; --bg: #F4F4F2; --ink: #0B0B12; --red: #FF4436; --green: #21A84A; --display: "Clash Grotesk", "Inter", sans-serif; }
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 1200px; height: 628px; overflow: hidden; background: var(--bg); }
#root { position: relative; width: 1200px; height: 628px; overflow: hidden; font-family: var(--display); color: var(--ink); background: var(--bg); }
.layer { position: absolute; inset: 0; }

/* 1. the resident's message */
#bubble { position: absolute; left: 80px; top: 176px; width: 1040px; padding: 40px 56px 48px; background: #fff; border: 5px solid var(--ink); border-radius: 48px; box-shadow: 14px 14px 0 var(--ink); }
#bubble::after { content: ""; position: absolute; left: 90px; bottom: -44px; width: 60px; height: 44px; background: var(--ink); clip-path: polygon(0 0, 100% 0, 0 100%); }
#bubble-tail { position: absolute; left: 96px; bottom: -28px; width: 40px; height: 30px; background: #fff; clip-path: polygon(0 0, 100% 0, 0 100%); z-index: 1; }
#msg { font-size: 96px; font-weight: 600; line-height: 1.04; letter-spacing: -0.03em; }
#msg .w { display: inline-block; position: relative; }
#msg .hl::before { content: ""; position: absolute; left: -6px; right: -6px; top: 14%; bottom: 6%; background: #FFE14D; border-radius: 10px; z-index: -1; transform: scaleX(var(--hl, 0)); transform-origin: left center; }
#you { position: absolute; left: 84px; top: 92px; font-size: 46px; font-weight: 600; color: var(--blue); letter-spacing: -0.01em; }

/* 2. the filled form, one big chip per field */
.row { position: absolute; left: 90px; height: 128px; display: flex; align-items: center; gap: 26px; }
.tag { width: 196px; font-size: 34px; font-weight: 600; color: #6B6B78; text-align: right; letter-spacing: -0.01em; }
.chip { height: 128px; display: flex; align-items: center; gap: 22px; padding: 0 40px 0 30px; border-radius: 30px; background: var(--blue); color: #fff; font-size: 68px; font-weight: 600; letter-spacing: -0.03em; white-space: nowrap; box-shadow: 10px 10px 0 var(--navy); }
.chip i { flex: none; width: 64px; height: 64px; border-radius: 50%; background: #fff; position: relative; }
.chip i::after { content: ""; position: absolute; left: 21px; top: 13px; width: 16px; height: 30px; border: solid var(--blue); border-width: 0 8px 8px 0; transform: rotate(45deg); border-radius: 2px; }
#r1 { top: 52px; } #r2 { top: 250px; } #r3 { top: 448px; }

/* 3. send */
#send { position: absolute; left: 600px; top: 314px; width: 520px; height: 168px; margin: -84px 0 0 -260px; border-radius: 999px; background: var(--ink); color: #fff; display: grid; place-items: center; font-size: 84px; font-weight: 600; letter-spacing: -0.03em; }
#flood { position: absolute; left: 600px; top: 314px; width: 1400px; height: 1400px; margin: -700px 0 0 -700px; border-radius: 50%; background: var(--blue); }

/* 4. sent + brand on blue */
#brand { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #fff; }
#logo { display: flex; align-items: center; gap: 30px; font-size: 168px; font-weight: 600; letter-spacing: -0.045em; line-height: 1; }
#logo svg { width: 168px; height: 168px; }
#tagline { margin-top: 30px; font-size: 56px; font-weight: 500; letter-spacing: -0.02em; color: #DCE4FF; }
#tagline span { display: inline-block; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="9" data-width="1200" data-height="628">

  <div class="layer" id="s1">
    <div id="you">You, in your own words:</div>
    <div id="bubble">
      <div id="bubble-tail"></div>
      <div id="msg"><span class="w hl" id="hl1">Cars</span> <span class="w hl" id="hl2">fly</span> <span class="w hl" id="hl3">through</span> <span class="w">the</span> <span class="w">light</span> <span class="w">by</span> <span class="w hl" id="hl4">PS&nbsp;3</span></div>
    </div>
  </div>

  <div class="layer" id="s2">
    <div class="row" id="r1"><div class="tag">Request</div><div class="chip"><i></i>Crossing guard</div></div>
    <div class="row" id="r2"><div class="tag">Corner</div><div class="chip"><i></i>Hudson &amp; Christopher</div></div>
    <div class="row" id="r3"><div class="tag">Sends to</div><div class="chip"><i></i>NYPD + CB2</div></div>
  </div>

  <div class="layer" id="s3">
    <div id="send">Send</div>
  </div>

  <div class="layer" id="s4">
    <div id="flood"></div>
    <div id="brand">
      <div id="logo">
        <svg viewBox="0 0 32 32"><rect width="32" height="32" rx="7" fill="#fff"/>
          <g transform="rotate(-12 16 16)">
            <g fill="#103FEF" stroke="#103FEF" stroke-width="1.6" stroke-linejoin="round"><path d="M3.6 13.2h3.4l13.4-6.6v18.8L7 18.8H3.6z"/><path d="M7.4 19.4l1.6 5.4h2.6l-1.3-4.6z"/></g>
            <g fill="none" stroke="#103FEF" stroke-width="2" stroke-linecap="round"><path d="M24.6 12.6a4.6 4.6 0 0 1 0 6.8"/><path d="M27.4 10a8.4 8.4 0 0 1 0 12"/></g>
            <g id="apple"><g transform="translate(13.6 16.2) rotate(-8) scale(0.9)">
              <path d="M0,-2.4 C-1.3,-3.5 -4.6,-3.6 -4.6,0 C-4.6,3.1 -2.6,4.9 -1.3,4.9 C-0.6,4.9 -0.4,4.5 0,4.5 C0.4,4.5 0.6,4.9 1.3,4.9 C2.6,4.9 4.6,3.1 4.6,0 C4.6,-3.6 1.3,-3.5 0,-2.4 Z" fill="#FF4436"/>
              <path d="M0.5,-3.1 C0.9,-5.1 2.9,-5.7 3.9,-5.3 C3.5,-3.7 1.9,-2.9 0.5,-3.1 Z" fill="#21A84A"/>
            </g></g>
          </g></svg>
        <div>Tell Us</div>
      </div>
      <div id="tagline"><span>Say</span> <span>it.</span> <span>We</span> <span>fill</span> <span>the</span> <span>form.</span></div>
    </div>
  </div>

</div>
<script>
window.__timelines = window.__timelines || {};
const tl = gsap.timeline({ paused: true });
const words = gsap.utils.toArray("#msg .w");

// start state: only the message scene is visible
tl.set(["#s2", "#s3", "#s4", "#brand"], { opacity: 0 }, 0);

// 1. the message pops in word by word (0.2 – 1.4)
tl.fromTo("#you", { opacity: 0, x: -20 }, { opacity: 1, x: 0, duration: 0.4, ease: "expo.out" }, 0.1);
tl.fromTo("#bubble", { scale: 0.7, rotation: -4, opacity: 0, transformOrigin: "15% 100%" }, { scale: 1, rotation: 0, opacity: 1, duration: 0.6, ease: "back.out(1.8)" }, 0.12);
tl.fromTo(words, { opacity: 0, y: 40, scale: 0.6 }, { opacity: 1, y: 0, scale: 1, duration: 0.42, ease: "back.out(2.2)", stagger: 0.1 }, 0.35);
// the words that matter get a marker swipe (1.65 – 2.15)
tl.fromTo(["#hl1", "#hl2", "#hl3", "#hl4"], { "--hl": 0 }, { "--hl": 1, duration: 0.22, ease: "power2.out", stagger: 0.09 }, 1.7);
// and the bubble flies off, left, with a smear (2.55)
tl.to("#s1", { x: -1300, filter: "blur(14px)", duration: 0.32, ease: "power3.in" }, 2.55);

// 2. the form fills itself, one big chip at a time (2.8 – 4.4)
tl.set("#s2", { opacity: 1 }, 2.8);
["#r1", "#r2", "#r3"].forEach((r, i) => {
  const at = 2.8 + i * 0.32;
  tl.fromTo(`${r} .chip`, { x: 1100, filter: "blur(12px)" }, { x: 0, filter: "blur(0px)", duration: 0.55, ease: "back.out(1.4)" }, at);
  tl.fromTo(`${r} .tag`, { opacity: 0 }, { opacity: 1, duration: 0.25, ease: "power2.out" }, at + 0.18);
  tl.fromTo(`${r} .chip i`, { scale: 0, rotation: -40 }, { scale: 1, rotation: 0, duration: 0.45, ease: "back.out(3)" }, at + 0.3);
});
// 3. the chips collapse into one Send button (4.65 – 5.1)
tl.to(".row", { x: (i) => [260, 120, 260][i], y: (i) => [262, 64, -134][i], scale: 0.2, opacity: 0, duration: 0.4, ease: "power3.in", stagger: 0.04 }, 4.65);
tl.set("#s3", { opacity: 1 }, 4.95);
tl.fromTo("#send", { scale: 0.2 }, { scale: 1, duration: 0.5, ease: "back.out(2.4)" }, 4.95);
// press
tl.to("#send", { scale: 0.86, duration: 0.1, ease: "power2.in" }, 5.6);
tl.to("#send", { scale: 1.02, duration: 0.18, ease: "back.out(3)" }, 5.7);

// 4. blue floods out of the button and Tell Us rises in on it (5.75 – 6.9)
tl.set("#s4", { opacity: 1 }, 5.75);
tl.fromTo("#flood", { scale: 0.08 }, { scale: 1, duration: 0.45, ease: "power3.in" }, 5.75);
tl.set("#s3", { opacity: 0 }, 6.15);
tl.set("#brand", { opacity: 1 }, 6.15);
tl.fromTo("#logo", { y: 640 }, { y: 0, duration: 0.6, ease: "back.out(1.3)" }, 6.15);
// the apple drops onto the megaphone last, with a little bounce (6.95 – 7.6)
tl.fromTo("#apple", { y: -40, rotation: -50, opacity: 0, svgOrigin: "13.6 16.2" }, { y: 0, rotation: 0, opacity: 1, duration: 0.6, ease: "bounce.out" }, 6.95);
tl.fromTo("#logo svg", { scaleY: 1 }, { scaleY: 0.9, duration: 0.07, ease: "power2.out", yoyo: true, repeat: 1, transformOrigin: "50% 100%" }, 7.2);
tl.fromTo("#tagline span", { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.15, ease: "power2.out", stagger: 0.07 }, 7.5);

// loop seam: the brand drops away and the light ground wipes back up (8.55 – 9)
tl.to("#brand", { y: 120, opacity: 0, duration: 0.25, ease: "power3.in" }, 8.55);
tl.to("#flood", { scale: 0, duration: 0.3, ease: "power3.in" }, 8.68);

window.__timelines["main"] = tl;
tl.seek(0);
</script>
</body>
</html>
