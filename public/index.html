<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Tell Us — share feedback with your community board and city agencies</title>
<meta name="description" content="Type or say your comment or concern about your neighborhood. We route it to the right 311 form or community board committee and fill it in for you to edit before submitting. A hackathon demo, not affiliated with the City of New York." />
<!-- Link previews (LinkedIn, Slack, iMessage, X): og.png and og.mp4 are rendered from a 1200x628 card -->
<meta property="og:type" content="website" />
<meta property="og:site_name" content="Tell Us" />
<meta property="og:url" content="https://tellus.paulgale.dev/" />
<meta property="og:title" content="Tell Us: say it in your own words, we'll find the form and fill it" />
<meta property="og:description" content="Type or speak. Tell Us picks the 311 request or community board committee from what you write, then drafts it for you to review and submit." />
<meta property="og:image" content="https://tellus.paulgale.dev/og.png" />
<meta property="og:image:width" content="1200" />
<meta property="og:image:height" content="628" />
<meta property="og:image:alt" content="A resident types &quot;We'd love to hold a block party on Bedford St this June&quot; and Tell Us fills in a Community Board 2 form: Street Activities &amp; Resiliency committee, Bedford St." />
<meta property="og:video" content="https://tellus.paulgale.dev/og.mp4" />
<meta property="og:video:secure_url" content="https://tellus.paulgale.dev/og.mp4" />
<meta property="og:video:type" content="video/mp4" />
<meta property="og:video:width" content="1200" />
<meta property="og:video:height" content="628" />
<meta name="twitter:card" content="summary_large_image" />
<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
<meta name="theme-color" content="#103FEF" />
<!-- NYC Digital Design System typefaces, loaded off the critical path as in formspeak -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="preconnect" href="https://api.fontshare.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&display=optional" media="print" onload="this.media='all'" />
<link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=clash-grotesk@500,600&display=optional" media="print" onload="this.media='all'" />
<link rel="stylesheet" href="nyc.css" />
<link rel="stylesheet" href="app.css" />
<link rel="modulepreload" href="js/main.js" />
<link rel="modulepreload" href="js/fields.js" />
<link rel="modulepreload" href="js/location.js" />
<link rel="modulepreload" href="js/send.js" />
<link rel="modulepreload" href="js/voice.js" />
<link rel="modulepreload" href="js/util.js" />
<link rel="modulepreload" href="js/record.js" />
<link rel="modulepreload" href="js/suggest.js" />
</head>
<body>
<div class="app">
  <div class="sr-only" id="srAnnounce" aria-live="polite" role="status" aria-atomic="true"></div>
  <main class="appmain">
    <p class="demochip"><span>Demo based on CB2 Manhattan</span></p>
    <h1 class="wordmark"><img class="wordmark-mark" src="favicon.svg" alt="" /><span class="hl">Tell</span> Us</h1>
    <p class="hero tagline">Describe your <span class="hl">thought, comment, or concern</span> about <span class="hl">something in CB2 Manhattan.</span></p>
    <p class="lede">We'll make sure your voice is heard and your issue addressed.</p>
    <p class="howlink"><a href="/how">How Tell Us works <span aria-hidden="true">→</span></a></p>

    <div class="composer" id="composer">
      <div class="composer-row">
        <div class="dock" id="dock">
          <div class="mic-wrap"><div class="ring" id="ring"></div>
            <button class="mic idle-pulse" id="micBtn" type="button" aria-pressed="false" aria-label="Start microphone">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M2 10v3"/><path d="M6 6v11"/><path d="M10 3v18"/><path d="M14 8v7"/><path d="M18 5v13"/><path d="M22 10v3"/></svg>
            </button>
          </div>
          <div class="mic-label" id="micLabel">Tap to talk</div>
        </div>
        <div class="composer-field">
          <label class="sr-only" for="message">What's on your mind?</label>
          <textarea id="message" class="ff-input composer-text" rows="4"></textarea>
          <div class="ghost" id="ghost" aria-hidden="true"><span></span><i class="ghost-caret"></i></div>
        </div>
      </div>
      <div class="composer-bar">
        <span class="status" id="status" aria-live="polite"></span>
        <button type="button" class="linkbtn" id="clearBtn" hidden>Clear</button>
      </div>
    </div>

    <div class="topics" id="examples"></div>

    <div id="verdict"></div>
    <div class="needed" id="needed" hidden aria-live="polite"></div>
    <section id="routed" hidden>
      <form class="liveform" id="form" autocomplete="off" novalidate></form>
      <div id="sendPanel"></div>
    </section>
  </main>
  <footer class="credit credit-foot">Built at the <a href="https://statecapacityecosystem.com/" target="_blank" rel="noopener">State Capacity Hackathon</a> by <a href="https://paulgale.dev" target="_blank" rel="noopener">Paul Gale</a>, <a href="https://www.linkedin.com/in/lmszu/" target="_blank" rel="noopener">Luke Szumyckyj</a> and <a href="https://www.linkedin.com/in/sam-ginsberg" target="_blank" rel="noopener">Sam Ginsberg</a>.</footer>
</div>
<script type="module" src="js/main.js"></script>
</body>
</html>
